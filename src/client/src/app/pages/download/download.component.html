<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow-lg">

                <div class="card-body p-4">

                    <h5 class="card-title mb-4">Download File</h5>

                    <div class="upload-zone border rounded text-center p-5 mb-3">

                        @if (transferInfo(); as info) {

                            <p>{{info.Filename}} ({{formatBytes(info.Size ?? 0)}})</p>

                            <button type="button" class="btn btn-primary w-100" (click)="onDownloadFile()">Download</button>

                            <p></p>
                            
                        }

                        @if (statusMessage()) {

                            <p>{{statusMessage()}}</p>

                        }

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

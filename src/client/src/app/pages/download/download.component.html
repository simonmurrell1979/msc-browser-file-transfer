<div class="download-card">

    <div class="card shadow-lg">

        <div class="card-body p-4">

            <h5 class="card-title mb-4">Download File</h5>

            @if (transferInfo(); as info) {

                <p class="mb-3">{{info.Filename}} ({{formatBytes(info.Size ?? 0)}})</p>

                <button type="button" class="btn btn-download w-100" (click)="onDownloadFile()">
                    <i class="bi bi-download me-2"></i>Download
                </button>
                
            }

            @if (statusMessage()) {

                <p class="small text-muted mt-3 mb-0">{{statusMessage()}}</p>

            }

        </div>

    </div>

</div>

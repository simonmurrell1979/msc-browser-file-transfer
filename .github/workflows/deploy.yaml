name: CI Deploy Tests

on:                                                                             # Copied from existing .NET project
    push:
        branches:
        - main
    pull_request:
        branches:
        - main  

jobs:

    server:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src/server/FileTransfer.RestAPI
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Restore .NET Projects                                       # Copied from existing .NET project
              run: dotnet restore
            - name: Build .NET Projects                                         # Copied from existing .NET project
              run: dotnet build --no-restore
            - name: Run .NET Tests                                              # Copied from existing .NET project
              run: dotnet test --no-build --verbosity normal

    client:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src/client
        steps:
            - name: Checkout Repository                                         # Copied from existing Angular project
              uses: actions/checkout@v4
            - name: Setup Node.js Environment                                   # Copied from existing Angular project
              uses: actions/setup-node@v5
              with:
                node-version: 22
            - name: Install Dependencies                                        # Copied from existing Angular project
              run: npm install
            - name: Run Angular Tests                                           # Copied from existing Angular project
              run: npx vitest --run --browsers=ChromeHeadless --single-run
name: CI Deploy Tests

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main  

jobs:

    server:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src/server/FileTransfer.RestAPI
        steps:
            - uses: actions/checkout@v4
            - name: Restore .NET Projects                                   # Copied from existing .NET project
              run: dotnet restore
            - name: Build .NET Projects                                     # Copied from existing .NET project
              run: dotnet build --no-restore
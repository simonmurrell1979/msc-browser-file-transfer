<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser Upload</title>
</head>
<body>

    <h1>Browser Upload</h1>

    <input type="file" id="fileUpload" />
    <button id="cmdUpload">Upload</button>
    <button id="cmdCancel" style="display: none">Cancel</button>
    <pre id="uploadStatus"></pre>

    <script src="upload.js" type="module"></script>
    <script>

        // Register the Service Worker
        navigator.serviceWorker.register('sw.js');

    </script>

</body>
</html>
